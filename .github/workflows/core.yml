name: Acquisizione giocatori e squadre
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,7 * * *'
permissions:
  contents: write
concurrency:
  group: aggiornamento-nba
  cancel-in-progress: false
jobs:
  acquisisci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Controlla finestra italiana
        id: orario
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ] || [ "$(TZ=Europe/Rome date +%H)" = "08" ]; then
            echo 'esegui=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.orario.outputs.esegui == 'true'
        with:
          python-version: '3.12'
      - if: steps.orario.outputs.esegui == 'true'
        run: pip install -r requirements.txt
      - name: Acquisisci dati principali
        if: steps.orario.outputs.esegui == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_core.py
      - name: Salva acquisizione e diagnosi
        if: always() && steps.orario.outputs.esegui == 'true'
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna giocatori e squadre NBA'
            git pull --rebase origin main
            git push
          fi
