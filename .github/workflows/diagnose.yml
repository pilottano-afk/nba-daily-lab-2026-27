name: Diagnosi quintetti
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Confronta copertura quintetti
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose_lineups.py
      - name: Salva diagnosi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lineup_diagnosis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Registra diagnosi quintetti'
            git pull --rebase origin main
            git push
          fi
