name: Acquisizione secondaria NBA
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aggiornamento-nba
  cancel-in-progress: false
jobs:
  acquisisci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - name: Acquisisci fonte secondaria
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_secondary.py
      - name: Conserva dati e diagnosi
        if: always()
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Registra acquisizione secondaria NBA'
            git pull --rebase origin main
            git push
          fi
