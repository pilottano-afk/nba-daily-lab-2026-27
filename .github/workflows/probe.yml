name: Verifica fonte secondaria
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verifica dati 2026-27
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/probe_secondary.py
      - name: Salva rapporto verificabile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Registra copertura fonte secondaria'
            git pull --rebase origin main
            git push
          fi
